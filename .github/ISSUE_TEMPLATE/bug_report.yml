name: Bug report
description: Report a broken flow or an incorrect repository finding.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce, the expected behavior, and the actual result.
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Public repository URL
      description: If this concerns an analysis result, link the repository and the relevant file.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and Node.js version if running locally.
